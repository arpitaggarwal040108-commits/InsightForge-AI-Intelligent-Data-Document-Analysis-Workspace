<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Prediction | Smart AI Assistant</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<header>

    <div class="logo">

        <i class="fa-solid fa-robot"></i>

        Smart AI Assistant

    </div>

    <nav>

        <a href="/">Home</a>

        <a href="/chat">AI Chat</a>

    </nav>

</header>

<div class="dashboard-container">

<h1>

🎯 Make a Prediction

</h1>

<p class="subtitle">

Enter feature values below and let your trained Machine Learning model predict the result.

</p>

<div class="glass-section">

<form method="POST" class="modern-form">

{% for feature in features %}

<label>

{{ feature }}

</label>

<input
type="text"
name="{{ feature }}"
placeholder="Enter {{ feature }}"
required>

{% endfor %}

<button
type="submit"
class="primary-btn">

<i class="fa-solid fa-wand-magic-sparkles"></i>

Predict

</button>

</form>

</div>

{% if prediction is not none %}

<div class="glass-section">

<h2>

Prediction Result

</h2>

<div class="prediction-box">

{{ prediction }}

</div>

</div>

{% endif %}

<div style="display:flex;
gap:20px;
justify-content:center;
margin-top:40px;
flex-wrap:wrap;">

<a href="/">

<button class="primary-btn">

<i class="fa-solid fa-upload"></i>

Upload New Dataset

</button>

</a>

<a href="/chat">

<button class="primary-btn">

<i class="fa-solid fa-comments"></i>

Ask AI

</button>

</a>

</div>

</div>

<footer>

<p>

© 2026 Smart AI Assistant

</p>

</footer>

</body>

</html>
